[project]
name = "imap-archiver"
version = "2.5.0.0"
description = "CLI-Client zum read-only Import von IMAP-Mails in eine lokale SQLite-DB"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15.0",
    "imapclient>=3.0.1",
    "pydantic-settings>=2.7.0",
    "rich>=13.0.0",
    "elasticsearch>=9,<10",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "httpx>=0.27.0",
    "weasyprint>=63",
]

[project.scripts]
mailarc = "app.main:app"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
