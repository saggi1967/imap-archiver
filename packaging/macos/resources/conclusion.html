<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: -apple-system, "Helvetica Neue", sans-serif; color: #1d1d1f;
         margin: 0; padding: 4px 2px; }
  h1 { font-size: 17px; margin: 0 0 10px; }
  p  { font-size: 12.5px; line-height: 1.5; margin: 0 0 10px; }
  code { background: #f1f3f7; border-radius: 4px; padding: 1px 5px;
         font-family: "SF Mono", Menlo, monospace; font-size: 11.5px; }
  .accent { color: #2563eb; font-weight: 600; }
</style>
</head>
<body>
  <h1><span class="accent">mailarc</span> ist installiert</h1>
  <p>Öffne ein neues Terminal-Fenster und leg los:</p>
  <p>
     <code>mailarc --version</code><br>
     <code>mailarc db init</code><br>
     <code>mailarc sync run</code>
  </p>
  <p>Eine Übersicht aller Befehle zeigt <code>mailarc --help</code>.</p>
</body>
</html>
